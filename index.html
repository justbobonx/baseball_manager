<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Baseball Manager</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <h1>Baseball Manager</h1>
    <div id="pb-status">No PocketBase URL</div>
    <button id="btn-settings" type="button">Settings</button>
  </header>

  <main>
    <section class="panel" id="setup-panel">
      <h2>League</h2>
      <div class="row">
        <button id="btn-generate" type="button" class="primary">Generate Player Pool</button>
        <span id="pool-count">—</span>
      </div>
      <div class="row">
        <input id="team-name" placeholder="New team name" />
        <button id="btn-create-team" type="button">Create Team</button>
        <select id="team-select"></select>
      </div>
    </section>

    <section class="panel" id="roster-panel" hidden>
      <h2>Roster — <span id="roster-team-name"></span> <span id="roster-lock"></span></h2>
      <div class="row">
        <button id="btn-auto-draft" type="button">Auto-Draft Empty Slots</button>
        <button id="btn-auto-order" type="button">Auto Batting Order</button>
      </div>
      <div id="slots" class="slots"></div>
    </section>

    <section class="panel" id="exhibition-panel">
      <h2>Exhibition</h2>
      <div class="row">
        <select id="exh-away"></select> at <select id="exh-home"></select>
        <button id="btn-exhibition" type="button" class="primary">Play Exhibition</button>
      </div>
      <div id="exhibition-result"></div>
    </section>

    <section class="panel" id="season-panel">
      <h2>Season</h2>
      <div class="row">
        <input id="season-name" placeholder="Season name" />
        <button id="btn-start-season" type="button" class="primary">Start Season</button>
        <select id="season-select"></select>
      </div>
      <div id="season-info"></div>
      <div class="row" id="season-actions"></div>
      <div id="standings"></div>
      <div id="schedule"></div>
      <div id="season-box"></div>
    </section>
  </main>

  <div id="settings-modal" class="modal hidden">
    <div class="modal-box">
      <h3>PocketBase URL</h3>
      <p>Paste your PocketBase Cloud instance URL (e.g. https://xxx.pocketbasecloud.com)</p>
      <input id="pb-url" class="wide" placeholder="https://..." />
      <div class="row">
        <button id="btn-save-url" type="button" class="primary">Save</button>
        <button id="btn-close-settings" type="button">Close</button>
      </div>
    </div>
  </div>

  <div id="picker-modal" class="modal hidden">
    <div class="modal-box">
      <h3 id="picker-title">Pick Player</h3>
      <div class="row">
        <button id="btn-release" type="button">Release Current Player</button>
        <button id="btn-close-picker" type="button">Cancel</button>
      </div>
      <div id="picker-list"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/pocketbase/dist/pocketbase.umd.js"></script>
  <script src="js/dao.js"></script>
  <script src="js/generator.js"></script>
  <script src="js/team.js"></script>
  <script src="js/sim.js"></script>
  <script src="js/season.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
