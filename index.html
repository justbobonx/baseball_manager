<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Baseball Manager</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <h1>Baseball Manager</h1>
    <div id="pb-status">No PocketBase URL</div>
    <button id="btn-settings" type="button">Settings</button>
  </header>

  <main>
    <section class="panel" id="setup-panel">
      <h2>Setup</h2>
      <div class="row">
        <button id="btn-generate" type="button" class="primary">Generate Player Pool</button>
        <span id="pool-count">—</span>
      </div>
      <div class="row">
        <input id="team-name" placeholder="New team name" />
        <button id="btn-create-team" type="button">Create Team</button>
        <select id="team-select"></select>
      </div>
    </section>

    <section class="panel" id="roster-panel" hidden>
      <h2>Roster — <span id="roster-team-name"></span></h2>
      <div id="slots" class="slots"></div>
      <div class="row" style="margin-top:12px">
        <button id="btn-sim" type="button" class="primary" disabled>Sim vs Opponent</button>
        <select id="opp-select"></select>
      </div>
    </section>

    <section class="panel" id="result-panel" hidden>
      <h2>Game Result</h2>
      <div id="result"></div>
    </section>
  </main>

  <!-- settings modal -->
  <div id="settings-modal" class="modal hidden">
    <div class="modal-box">
      <h3>PocketBase URL</h3>
      <p>Paste your PocketBase Cloud instance URL (e.g. https://xxx.pocketbasecloud.com)</p>
      <input id="pb-url" style="width:100%; margin-bottom:12px" placeholder="https://..." />
      <div class="row">
        <button id="btn-save-url" type="button" class="primary">Save</button>
        <button id="btn-close-settings" type="button">Close</button>
      </div>
    </div>
  </div>

  <!-- player picker modal -->
  <div id="picker-modal" class="modal hidden">
    <div class="modal-box">
      <h3 id="picker-title">Pick Player</h3>
      <div id="picker-list"></div>
      <button id="btn-close-picker" type="button" style="margin-top:12px">Cancel</button>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
